name: Deploy to REG.RU

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, fileinfo, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies for build
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='deploy.tar.gz' \
            --exclude='.ftp-deploy-sync-state.json' \
            ./ deploy/

          mkdir -p deploy/bootstrap/cache
          mkdir -p deploy/storage/app
          mkdir -p deploy/storage/framework/cache
          mkdir -p deploy/storage/framework/sessions
          mkdir -p deploy/storage/framework/views
          mkdir -p deploy/storage/logs

      - name: Check deploy directory
        run: |
          echo "Files prepared for deploy:"
          find deploy -type f | wc -l

          echo "Checking excluded directories:"
          if [ -d deploy/node_modules ]; then echo "ERROR: node_modules exists"; exit 1; fi
          if [ -d deploy/vendor ]; then echo "ERROR: vendor exists"; exit 1; fi
          if [ -d deploy/.git ]; then echo "ERROR: .git exists"; exit 1; fi
          if [ -f deploy/.env ]; then echo "ERROR: .env exists"; exit 1; fi

      - name: Deploy to REG.RU via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /www/code-doctor.ru/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.ftp-deploy-sync-state.json

      - name: Install Composer dependencies and optimize Laravel on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/www/code-doctor.ru

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            mkdir -p bootstrap/cache
            mkdir -p storage/app
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            chmod -R 775 bootstrap/cache storage/framework storage/logs

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
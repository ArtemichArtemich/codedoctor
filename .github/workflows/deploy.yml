name: Deploy to REG.RU

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # PHP / COMPOSER
      # Нужен в том числе для сборки темы Filament,
      # которая импортирует CSS из vendor/
      # =====================================================

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, fileinfo, zip
          tools: composer


      # =====================================================
      # COMPOSER CACHE
      # =====================================================

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-


      # =====================================================
      # PREPARE LARAVEL
      # =====================================================

      - name: Prepare Laravel directories for build
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/app
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

          chmod -R 775 bootstrap/cache storage


      # =====================================================
      # PHP DEPENDENCIES FOR BUILD
      # =====================================================

      - name: Install Composer dependencies for build
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-scripts


      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # =====================================================
      # FRONTEND
      # =====================================================

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


      # =====================================================
      # PREPARE DEPLOY DIRECTORY
      # =====================================================

      - name: Prepare deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='deploy.tar.gz' \
            --exclude='.ftp-deploy-sync-state.json' \
            ./ deploy/

          mkdir -p deploy/bootstrap/cache

          echo "DEPLOY SHA: $GITHUB_SHA" > deploy/DEPLOY_MARKER.txt
          echo "DEPLOY TIME: $(date)" >> deploy/DEPLOY_MARKER.txt


      # =====================================================
      # CHECK DEPLOY DIRECTORY
      # =====================================================

      - name: Check deploy directory
        run: |
          echo "Files prepared for deploy:"
          find deploy -type f | wc -l

          echo "Checking excluded files and directories..."

          if [ -d deploy/node_modules ]; then
            echo "ERROR: node_modules exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/vendor ]; then
            echo "ERROR: vendor exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/.git ]; then
            echo "ERROR: .git exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/.github ]; then
            echo "ERROR: .github exists in deploy directory"
            exit 1
          fi

          if [ -f deploy/.env ]; then
            echo "ERROR: .env exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/storage ]; then
            echo "ERROR: storage exists in deploy directory"
            exit 1
          fi


      # =====================================================
      # FTP DEPLOY
      # =====================================================

      - name: Install dependencies and optimize Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            cd ~/www/code-doctor.ru

            PHP="/opt/php/8.2/bin/php"
            COMPOSER="$HOME/bin/composer"

            echo "PHP version:"
            $PHP -v

            echo "Composer version:"
            $PHP $COMPOSER --version

            echo "Preparing Laravel directories..."

            mkdir -p bootstrap/cache
            mkdir -p storage/app
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            chmod -R 775 bootstrap/cache storage

            echo "Installing Composer dependencies..."

            $PHP $COMPOSER install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            echo "Clearing Laravel caches..."

            $PHP artisan config:clear
            $PHP artisan cache:clear
            $PHP artisan route:clear
            $PHP artisan view:clear

            echo "Running migrations..."

            $PHP artisan migrate --force

            echo "Caching Laravel..."

            $PHP artisan config:cache
            $PHP artisan route:cache

            echo "Deploy completed successfully."
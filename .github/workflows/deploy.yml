name: Deploy to REG.RU

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # =====================================================
      # FRONTEND BUILD
      # =====================================================

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


      # =====================================================
      # PREPARE DEPLOY
      # =====================================================

      - name: Prepare deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='deploy' \
            --exclude='deploy.tar.gz' \
            --exclude='.ftp-deploy-sync-state.json' \
            ./ deploy/

          mkdir -p deploy/bootstrap/cache

          echo "DEPLOY SHA: $GITHUB_SHA" > deploy/DEPLOY_MARKER.txt
          echo "DEPLOY TIME: $(date)" >> deploy/DEPLOY_MARKER.txt


      # =====================================================
      # CHECK DEPLOY DIRECTORY
      # =====================================================

      - name: Check deploy directory
        run: |
          echo "Files prepared for deploy:"
          find deploy -type f | wc -l

          echo "Checking excluded files and directories..."

          if [ -d deploy/node_modules ]; then
            echo "ERROR: node_modules exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/vendor ]; then
            echo "ERROR: vendor exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/.git ]; then
            echo "ERROR: .git exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/.github ]; then
            echo "ERROR: .github exists in deploy directory"
            exit 1
          fi

          if [ -f deploy/.env ]; then
            echo "ERROR: .env exists in deploy directory"
            exit 1
          fi

          if [ -d deploy/storage ]; then
            echo "ERROR: storage exists in deploy directory"
            exit 1
          fi


      # =====================================================
      # FTP DEPLOY
      # =====================================================

      - name: Deploy to REG.RU via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/.env.*
            **/storage/**


      # =====================================================
      # SERVER
      # =====================================================

      - name: Install dependencies and optimize Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            cd ~/www/code-doctor.ru

            echo "Preparing Laravel directories..."

            mkdir -p bootstrap/cache
            mkdir -p storage/app
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs

            chmod -R 775 bootstrap/cache storage

            echo "Installing Composer dependencies..."

            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            echo "Clearing Laravel caches..."

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            echo "Running migrations..."

            php artisan migrate --force

            echo "Caching Laravel configuration..."

            php artisan config:cache
            php artisan route:cache

            echo "Deploy completed successfully."